version: 0.0
os: linux
files:
  - source: release.env
    destination: /opt/spotify-hybrid
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: deploy/scripts/install_dependencies.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: deploy/scripts/start_docker.sh
      timeout: 300
      runas: root

name: Rewrite history as Ishan Sharma

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create fresh single-author history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ishan Sharma"
          git config user.email "Ishansharma3107@users.noreply.github.com"
          git checkout --orphan clean-main
          git add -A
          git commit -m "Publish project under Ishan Sharma"
          git branch -M master
          git push --force origin master

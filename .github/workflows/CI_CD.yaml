name: Validate local application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SPOTIFY_NO_BROWSER: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python test_environment.py
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build -t spotify-hybrid-ci .
      - run: |
          docker run -d --name spotify-hybrid-ci -p 127.0.0.1:8000:8000 spotify-hybrid-ci
          sleep 10
          docker ps -a
          docker logs spotify-hybrid-ci
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/_stcore/health

